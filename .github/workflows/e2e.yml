# Separate from CI. Runs the read-only Playwright smoke against a Vercel preview URL.
name: e2e

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Preview or local URL to test
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: e2e-${{ github.event.deployment.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright smoke
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && contains(github.event.deployment_status.environment, 'Preview')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Require BASE_URL
        run: test -n "$BASE_URL"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Smoke
        env:
          # Optional. Unset until the repo secret exists. The value is not printed.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e

      - name: Upload perf baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-baseline
          path: e2e/results/perf-baseline.json
          if-no-files-found: warn
