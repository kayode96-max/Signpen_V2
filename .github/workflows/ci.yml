name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs for the same PR / branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fake placeholders so `next build` can run without real credentials.
      # Real values live only in Vercel environment variables.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit tests on every pull request. Playwright against a Vercel preview
      # stays in QA's e2e workflow; this job does not request a preview URL.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Report-only until landing assets are under budget (PR #18).
      # One-line change to make this step blocking: ENFORCE_PERF_BUDGETS: "1"
      - name: Performance budget
        env:
          ENFORCE_PERF_BUDGETS: "0"
        run: npm run perf:budget
